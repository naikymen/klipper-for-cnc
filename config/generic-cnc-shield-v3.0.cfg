# This file contains common pin mappings for the Protoneer CNC-Shield
# (v3.0) board. The CNC-Shield is mounted on an Arduino UNO, so the
# firmware must be compiled for the AVR atmega328p (or atmega328).
#
# The config describes a basic Cartesian CNC machine: the XYZ steppers
# of the shield plus a fourth stepper on the shield's independent
# A-axis driver, which is configured as an "extruder" stepper. On a CNC
# machine that stepper usually drives a tool rather than a filament
# extruder - for example a pipette plunger or a rotary axis - and this
# fork extends the "extruder" section so that such an axis can be
# homed, limited and probed like any other axis (see
# docs/CNC_Reimplementation.md).
#
# See docs/Config_Reference.md for a description of the parameters.

[stepper_x]
step_pin: PD2
dir_pin: PD5
enable_pin: !PB0
microsteps: 1
# Belt driven axes: https://www.klipper3d.org/Rotation_Distance.html#belt-driven-axes
# rotation_distance = <belt_pitch> * <number_of_teeth_on_pulley>
rotation_distance: 40
# endstop_pin is required even if you don't use endstops.
# Add ! after ^ if you use NO endstops instead of NC.
endstop_pin: ^!PB1
position_endstop: 0
# A negative position_min lets the machine be moved slightly past the
# endstop, which is useful when the endstop does not sit at the very
# end of the travel.
position_min: -1
position_max: 330
homing_positive_dir: False
homing_speed: 100
second_homing_speed: 25.0

[stepper_y]
step_pin: PD3
dir_pin: !PD6
enable_pin: !PB0
microsteps: 1
rotation_distance: 40
# endstop_pin is required even if you don't use endstops.
# Add ! after ^ if you use NO endstops instead of NC.
endstop_pin: ^!PB2
# No need to set home direction manually: Klipper understands the
# correct direction by seeing that position_endstop = position_min.
position_endstop: 0
position_min: -1
position_max: 312
homing_positive_dir: False
homing_speed: 100
second_homing_speed: 25.0

[stepper_z]
step_pin: PD4
dir_pin: PD7
enable_pin: !PB0
microsteps: 1
# https://www.klipper3d.org/Rotation_Distance.html
# Amount of distance that the axis moves with one full revolution of
# the stepper motor (8 mm lead-screw advance per rotation).
rotation_distance: 8
endstop_pin: ^!PB3
# This axis homes towards position_max, so the endstop is at the top of
# the travel.
position_endstop: 150
position_min: -20
position_max: 150
homing_positive_dir: True
homing_speed: 100
second_homing_speed: 25.0

[extruder]
# Configure the stepper of the shield's independent A-axis driver. On
# this board the A axis may not be used at the same time as the
# variable spindle mode (see the board_pins section below).
step_pin: PB4
dir_pin: PB5
enable_pin: !PB0
microsteps: 1
rotation_distance: 40
nozzle_diameter: 1
filament_diameter: 1
# The extruder module limits how much material may be extruded during a
# move. Those limits assume a printing extruder, so they are disabled
# here.
max_extrude_cross_section: 9999
max_extrude_only_distance: 9999
max_extrude_only_velocity: 50
max_extrude_only_accel: 100
# The maximum speed of the axis during the junction of two moves.
instantaneous_corner_velocity: 50
# The tool of a CNC machine is not a hotend, so moves of this axis are
# not blocked while it is cold.
min_extrude_temp: 0
# Homing and limits for the axis: add an endstop_pin (together with
# position_endstop and position_max, and optionally position_min) to
# turn this stepper into a home-able axis that must be homed before it
# will move. See docs/Config_Reference.md for the [extruder] homing
# parameters and docs/G-Codes.md for the HOME_EXTRUDER command.
#endstop_pin: ^!PC0

# The remaining variables describe the heater (or the tool output) of
# this section. They reuse the shield's unused A4 / "SDA" and A5 /
# "SCL" pins.
heater_pin: PC4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 1
pid_Ki: 1
pid_Kd: 1
min_temp: 0
max_temp: 210

[heater_bed]
# The shield has no dedicated bed outputs, so this section reuses the
# unused A1 / "Feed hold" and A2 / "Resume" pins.
heater_pin: PC1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC2
control: watermark
min_temp: 0
max_temp: 130

[fan]
# Wired to the spindle coolant enable output of the shield.
pin: PC3

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
# On a machine that uses the fourth stepper as a home-able axis (rather
# than as a filament extruder) the extruder coordinate should be
# absolute across tool changes:
#relative_e_restore: False
#tool_change_e_reset: False

# The extra axes of this fork may also be declared directly, instead of
# being driven through the extruder module. For example, the following
# section registers the shield's A-axis stepper as the "A" G-Code axis,
# which makes it participate in G1 moves, G28 homing and M114
# reporting. See docs/G-Codes.md for the extra axis commands.
#[manual_stepper a_stepper]
#step_pin: PB4
#dir_pin: PB5
#enable_pin: !PB0
#microsteps: 1
#rotation_distance: 40
#velocity: 50
#accel: 1000
#gcode_axis: A
#position_min: -1
#position_max: 330
#endstop_pin: ^!PC0
#position_endstop: 0
#homing_speed: 25
#second_homing_speed: 5

# Arduino UNO - Protoneer CNC-Shield (v3.0) aliases for atmega328/328p
# boards. The pin names are equal to the ones in the "arduino-standard"
# alias section, which may be used to quickly figure out which pins are
# "analog input" pins (i.e. A0-A5) with ADCs, as those are required for
# extruder temperature sensors.
[board_pins protoneer-cnc-shield-v30]
aliases:
    # RX/TX pins for serial communication (do not use).
    rx=PD0, tx=PD1,
    # XYZ step pins:
    xstep=PD2, ystep=PD3, zstep=PD4,
    # XYZ direction pins:
    xdir=PD5, ydir=PD6, zdir=PD7,
    # Enable steppers pin:
    stepen=PB0,
    # Endstop pins:
    xlimit=PB1, ylimit=PB2, zlimit=PB3,
    # Independent A-axis stepper mode:
    # NOTE: Additional jumpers must be placed on the board.
    astep=PB4, adir=PB5,
    # Variable spindle mode:
    # NOTE: Incompatible with the independent A-axis.
    # spinen=PB4, spindir=PB5,
    # Coolant enable:
    coolen=PC3,
    # Job control pins:
    abort=PC0, hold=PC1, resume=PC2,
    # I2C pins / GRBL probing pin:
    sda=PC4, scl=PC5
