# Config for extruder coordinate and limit behavior testing
#
# Same machine as homeable_extruder.cfg, but opting in to the fork's
# extruder coordinate semantics: E stays absolute across tool changes and
# g-code state restores, symmetric_speed_limits applies the extruder-only
# speed and acceleration limits to every move, and force_move is enabled so
# SET_KINEMATIC_POSITION can reset the extruder coordinate.
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210
endstop_pin: ^PH3
position_min: -5
position_max: 50
position_endstop: 0
homing_speed: 10
homing_retract_dist: 2
max_extrude_only_distance: 1000
symmetric_speed_limits: True

[extruder1]
step_pin: PH5
dir_pin: !PH6
enable_pin: !PB5
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210
endstop_pin: ^PK7
position_min: -5
position_max: 50
position_endstop: 50
homing_speed: 10
homing_retract_dist: 2
max_extrude_only_distance: 1000

[force_move]
enable_force_move: True

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
relative_e_restore: False
tool_change_e_reset: False
