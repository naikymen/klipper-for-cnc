# Fixture: incomplete *primary* axis set (X and Y but no Z) combined with a
# declared extra axis.
#
# The cartesian kinematics requires all three primary axes, so this
# configuration must be rejected at startup.  See
# extra_axis_partial_axes.test for why that matters.

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

# The declared extra axis of this "XYA"-shaped configuration.
[manual_stepper a_stepper]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 500
position_min: 0
position_max: 100
gcode_axis: A
