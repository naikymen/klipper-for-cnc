# Config for documenting current ToolHead extra-axis behavior.
# This fixture exercises the dynamic extra_axes collection in ToolHead
# together with synchronized manual steppers registered via
# MANUAL_STEPPER ... GCODE_AXIS=<letter>. It is the baseline ("F0")
# against which declarative ABC axes will be built.

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

# A manually configured extra axis without an endstop. Used to document
# G1 synchronization, velocity/acceleration limits, junction handling,
# and unregister/re-register behavior.
[manual_stepper a_stepper]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 500
position_min: 0
position_max: 100

# A manually configured extra axis with an endstop. Used to document the
# endstop-assisted move modes (STOP_ON_ENDSTOP home/probe variants).
[manual_stepper homing_stepper]
step_pin: PB6
dir_pin: !PB7
enable_pin: !PB5
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
position_min: -5
position_max: 50
velocity: 20
accel: 1000
