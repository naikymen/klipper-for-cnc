# F2 fixture: homeable extra axis without position_min/position_max.
#
# The B axis has an endstop (so it is home-able) but no travel limits, which
# is only detected when the axis is actually homed.
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

# Home-able, but unusable for homing: no position_min/position_max.
[manual_stepper homing_stepper]
step_pin: PB6
dir_pin: !PB7
enable_pin: !PB5
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
velocity: 20
accel: 1000
gcode_axis: B
