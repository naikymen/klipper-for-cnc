# F10 fixture: 'require_heater: False' on a heater-less extruder.
#
# By default a positive temperature request to a heater-less extruder is an
# error (see extruder_no_heater_error.test), which suits a syringe extruder
# that must never be heated.  With 'require_heater: False' every heating
# command is instead silently ignored, which suits profiles shared with a
# heated machine (eg, a slicer start script that always sends M104/M109).

[mcu]
serial: /dev/ttyACM0

[gcode_macro ASSERT_TARGET_IGNORED]
description: Fail unless the extruder target temperature stayed at zero
gcode:
    {% if printer.extruder.target != 0 %}
        {action_raise_error("temperature request was not ignored: target=%s"
                            % printer.extruder.target)}
    {% endif %}
    {action_respond_info("temperature requests ignored as configured")}

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
require_heater: False
max_extrude_only_distance: 1000
