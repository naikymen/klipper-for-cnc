# Fixture for the [status_msg] extra (GET_STATUS_MSG).
#
# The machine is an XYZA cartesian so that the dumped status carries the extra
# axis alongside the primary ones, which is the interesting case for this fork.

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[manual_stepper a_stepper]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 500
position_min: 0
position_max: 100
gcode_axis: A

[status_msg]

# The harness cannot read the console, and an unknown command is only a
# warning, so the fixture checks the registration through the same webhook
# status that frontends read.
[gcode_macro ASSERT_GET_STATUS_MSG]
description: Fail unless GET_STATUS_MSG is registered and documented
gcode:
  {% set help = printer.gcode.commands.get('GET_STATUS_MSG', {}).get('help', '') %}
  {% if not help %}
    {action_raise_error("GET_STATUS_MSG is not registered with a help string")}
  {% endif %}
  {action_respond_info("GET_STATUS_MSG: %s" % (help,))}
