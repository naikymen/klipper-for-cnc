# F10 fixture: extruder sections without any heating hardware.
#
# A syringe / paste / clay extruder needs a motor but not a heater or a
# temperature sensor, so 'heater_pin', 'sensor_type' and 'sensor_pin' are
# all optional in [extruder] / [extruderN].  Here both extruders are
# heater-less, which also proves that a printer with no heaters at all
# still starts and still answers M105.  The extruder steppers are
# home-able (F5) to cover both features together.

[mcu]
serial: /dev/ttyACM0

# Guard macro used by extruder_no_heater.test.  A heater-less extruder must
# still report the same status keys as a real heater (with zero values), so
# that display frontends and macros need no special case, and it must not be
# registered with the 'heaters' object (the point of the feature is that the
# pins stay free, so nothing may claim a heater or a sensor).
[gcode_macro ASSERT_HEATERLESS_EXTRUDER_STATUS]
description: Fail unless the heater-less extruders report a zeroed heater status
gcode:
    {% for name in ['extruder', 'extruder1'] %}
        {% set sts = printer[name] %}
        {% if not sts.can_extrude %}
            {action_raise_error("%s reports can_extrude=False" % name)}
        {% endif %}
        {% if sts.temperature != 0 or sts.target != 0 or sts.power != 0 %}
            {action_raise_error("%s reports temperature=%s target=%s power=%s"
                                % (name, sts.temperature, sts.target,
                                   sts.power))}
        {% endif %}
        {% if 'temperature' not in sts or 'target' not in sts
              or 'power' not in sts %}
            {action_raise_error("%s is missing heater status keys" % name)}
        {% endif %}
    {% endfor %}
    {% if printer.heaters.available_heaters %}
        {action_raise_error("heaters were registered: %s"
                            % printer.heaters.available_heaters)}
    {% endif %}
    {% if printer.heaters.available_sensors %}
        {action_raise_error("sensors were registered: %s"
                            % printer.heaters.available_sensors)}
    {% endif %}
    {action_respond_info("heater-less extruder status OK")}

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

# Syringe extruder: no heater_pin, no sensor, no heating options.
[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
endstop_pin: ^PH3
position_min: -5
position_max: 50
position_endstop: 0
homing_speed: 10
homing_retract_dist: 2
max_extrude_only_distance: 1000

# Second heater-less extruder, homing towards position_max.
[extruder1]
step_pin: PH5
dir_pin: !PH6
enable_pin: !PB5
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
endstop_pin: ^PK7
position_min: -5
position_max: 50
position_endstop: 50
homing_speed: 10
homing_retract_dist: 2
max_extrude_only_distance: 1000
