# R1 fixture: SET_SKEW_FACTORS sets skew correction factors directly.
#
# The factors are the numbers an orthogonal-axis-compensation tool, a CMM or
# a CAD measurement produces, so a user should not have to invent three
# lengths just to feed SET_SKEW.  This configuration is a plain cartesian
# printer so that the effect of a factor on a move is observable through the
# toolhead position.

[mcu]
serial: /dev/ttyACM0

# Guard macro used by skew_correction_factors.test.  The logical position
# reported by gcode_move is the position the user asked for, and the toolhead
# position is where the skew transform sent the machine, so asserting both
# pins down the correction that was applied to the move in between.
[gcode_macro ASSERT_SKEW_POSITION]
description: Fail unless the logical and the transformed positions match
gcode:
    {% set logical = printer.gcode_move.position %}
    {% set toolhead = printer['toolhead'].position %}
    {% set want_logical = [params.GX|float, params.GY|float, params.GZ|float] %}
    {% set have_logical = [logical.x, logical.y, logical.z] %}
    {% set want_toolhead = [params.TX|float, params.TY|float, params.TZ|float] %}
    {% set have_toolhead = [toolhead.x, toolhead.y, toolhead.z] %}
    {% for axis in range(3) %}
        {% if (have_logical[axis] - want_logical[axis])|abs > 0.000001 %}
            {action_raise_error("logical axis %d is %s, expected %s"
                                % (axis, have_logical[axis],
                                   want_logical[axis]))}
        {% endif %}
        {% if (have_toolhead[axis] - want_toolhead[axis])|abs > 0.000001 %}
            {action_raise_error("transformed axis %d is %s, expected %s"
                                % (axis, have_toolhead[axis],
                                   want_toolhead[axis]))}
        {% endif %}
    {% endfor %}
    {action_respond_info("skew position OK")}

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0
position_max: 200

[skew_correction]
