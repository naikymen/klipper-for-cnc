# F6 fixture: steppers sharing a single driver enable pin.
#
# The X, Y, Z and extruder steppers plus both manual steppers share one
# enable_pin. The enable line must only be released once every stepper that
# shares it has been disabled (see stepper_enable.StepperEnablePin), so
# M84 and SET_STEPPER_ENABLE must keep the shared reference count balanced.
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PD7
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PD7
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210
max_extrude_only_distance: 1000

# Shared-enable extra axis without an endstop.
[manual_stepper a_stepper]
step_pin: PG0
dir_pin: PG1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 500
position_min: 0
position_max: 100

# Shared-enable extra axis with an endstop.
[manual_stepper homing_stepper]
step_pin: PB6
dir_pin: !PB7
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
position_min: -5
position_max: 50
velocity: 20
accel: 1000
gcode_axis: B
