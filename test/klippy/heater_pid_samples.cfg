# F8 fixture: "samples" on every PID-controlled heater.
#
# Each of the three heaters below uses "control: pid", but only some of them
# set the new "samples" option, so this run also covers the default path where
# the option is absent.  A heater_generic is included because ControlPID is
# shared by [extruder], [heater_bed] and [heater_generic].
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: AD595
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
samples: 5
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: PT100 INA826
sensor_pin: PK6
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
samples: 2
min_temp: 0
max_temp: 130

[heater_generic chamber]
heater_pin: PH6
sensor_type: PT100 INA826
sensor_pin: PE4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
samples: 10
min_temp: 0
max_temp: 100

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
