# Config for a K4CNC-style machine: Cartesian XYZ plus three extra
# axes declared through [manual_stepper] "gcode_axis: A/B/C", a
# home-able "extruder" stepper driven as a tool axis, and two named
# directional G38 probes.
#
# This fixture exercises the fork's CNC features together on a single
# machine: declarative extra axes, extra axis homing, a home-able
# extruder and multiple named directional probes (including the
# selection of the probe named after the active extruder).
# ATMEGA644p pinout: https://www.uzebox.org/wiki/images/a/a4/Atmega644-pinout.png

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[force_move]
enable_force_move: True

[gcode_macro SET_ORIGIN]
# Unlock the machine and set the origin at the current position.
gcode:
  SET_KINEMATIC_POSITION X=0 Y=0 Z=0 E=0

[stepper_x]
step_pin: PB1
dir_pin: PB2
enable_pin: !PB0
microsteps: 8
rotation_distance: 40
endstop_pin: ^!PB3
position_endstop: 0
position_min: -1
position_max: 330
homing_positive_dir: False
homing_speed: 100
second_homing_speed: 25.0

[stepper_y]
step_pin: PB4
dir_pin: !PB5
enable_pin: !PB0
microsteps: 8
rotation_distance: 40
endstop_pin: ^!PB6
position_endstop: 0
position_min: -1
position_max: 312
homing_positive_dir: False
homing_speed: 100
second_homing_speed: 25.0

[stepper_z]
step_pin: PB7
dir_pin: !PD2
enable_pin: !PB0
microsteps: 8
rotation_distance: 8
endstop_pin: ^!PD3
position_endstop: 150
position_min: -20
position_max: 150
homing_positive_dir: True
homing_speed: 100
second_homing_speed: 25.0

# The extra axes are declared in config: "gcode_axis" registers them as
# the G-Code axes A, B and C at connect time, so they take part in G1
# moves, G28 homing, M114 reporting and the M211 soft limit switch.
# An axis with an endstop_pin must be homed before it will move.

[manual_stepper a_stepper]
step_pin: PD4
dir_pin: PD5
enable_pin: !PB0
microsteps: 8
rotation_distance: 40
velocity: 25
accel: 1000
gcode_axis: A
endstop_pin: ^PD6
# Homing options: position_endstop is where the endstop triggers, and
# position_min/position_max are the travel limits of the axis. The
# homing direction is inferred from position_endstop (here the axis
# homes towards 0).
position_endstop: 0
position_min: -1
position_max: 30
homing_speed: 25
second_homing_speed: 6

[manual_stepper b_stepper]
step_pin: PD7
dir_pin: !PC0
enable_pin: !PB0
microsteps: 16
rotation_distance: 2
velocity: 25
accel: 1000
gcode_axis: B
endstop_pin: ^!PC1
position_endstop: 0
position_min: -1
position_max: 30
homing_speed: 25
second_homing_speed: 6

[manual_stepper c_stepper]
step_pin: PC2
dir_pin: !PC3
enable_pin: !PB0
microsteps: 16
rotation_distance: 2
velocity: 25
accel: 1000
gcode_axis: C
endstop_pin: ^!PC4
position_endstop: 0
position_min: -1
position_max: 30
homing_speed: 25
second_homing_speed: 6

[extruder]
# The fourth stepper of this machine drives a tool, so the "extruder"
# limits that assume a filament extruder are effectively disabled.
step_pin: PC6
dir_pin: PC7
enable_pin: PA1
microsteps: 1
rotation_distance: 33.5
nozzle_diameter: 1
filament_diameter: 1
min_extrude_temp: 0
max_extrude_cross_section: 9999
max_extrude_only_distance: 9999
max_extrude_only_velocity: 50
max_extrude_only_accel: 100
instantaneous_corner_velocity: 50
# Homing and limits for the tool axis: with an endstop_pin the stepper
# becomes a home-able axis and must be homed before it will move (see
# docs/G-Codes.md for HOME_EXTRUDER and the M211 soft limit switch).
endstop_pin: ^PA0
position_endstop: -10.
position_min: -10.
position_max: 3000.
homing_speed: 50.
homing_positive_dir: False
# Absolute movements of the tool axis are used for CNC pipetting, so
# the extruder speed limits are applied to both directions.
symmetric_speed_limits: True
# Extruder heater.
heater_pin: PC5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA7
control: pid
pid_Kp: 1
pid_Ki: 1
pid_Kd: 1
min_temp: 0
max_temp: 210

# The probe of the tool axis: it is associated to the extruder because
# the probe name matches the active extruder name, which makes the
# ordinary G38 commands use it.
[probe_G38_multi extruder]
recovery_time: 0.0
pin: ^PA2

# A second, independent probe. The ordinary G38 commands select it only
# after an explicit SET_PROBE_G38.
[probe_G38_multi axis_probe]
recovery_time: 0.0
pin: ^PA4
