# F10 fixture: one heater-less extruder next to a normal heated one.
#
# This is the realistic migration case - a heated hotend plus a syringe
# extruder.  The heater-less extruder must not disturb the heater that the
# heated extruder registers, and the heated extruder must keep working
# unchanged.

[mcu]
serial: /dev/ttyACM0

# Guard macro used by extruder_no_heater_mixed.test: the heated extruder
# must be the only registered heater (so 'T0' stays the hotend and 'T1' has
# no temperature), and the heater-less extruder must still expose a
# can_extrude property for the extrusion checks.
[gcode_macro ASSERT_HEATERLESS_EXTRUDER1]
description: Fail unless only the heated extruder registered a heater
gcode:
    {% if printer.heaters.available_heaters != ['extruder'] %}
        {action_raise_error("available_heaters is %s, expected ['extruder']"
                            % printer.heaters.available_heaters)}
    {% endif %}
    {% if printer.extruder1.can_extrude != True %}
        {action_raise_error("extruder1 reports can_extrude=%s"
                            % printer.extruder1.can_extrude)}
    {% endif %}
    {% if printer.extruder1.target != 0 or printer.extruder1.power != 0 %}
        {action_raise_error("extruder1 reports target=%s power=%s"
                            % (printer.extruder1.target,
                               printer.extruder1.power))}
    {% endif %}
    {action_respond_info("mixed heated / heater-less extruders OK")}

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

# Normal heated hotend; 'require_heater' is accepted and ignored here.
[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210
require_heater: False
max_extrude_only_distance: 1000

# Heater-less syringe extruder.
[extruder1]
step_pin: PH5
dir_pin: !PH6
enable_pin: !PB5
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
max_extrude_only_distance: 1000
