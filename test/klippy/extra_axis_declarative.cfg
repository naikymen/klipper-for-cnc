# F1 fixture: declarative ABC axes via [manual_stepper] gcode_axis:.
#
# Contrast with extra_axis.cfg (F0), which registers A/B dynamically via
# MANUAL_STEPPER ... GCODE_AXIS=. Here the axes are declared in config and
# auto-registered when the toolhead is created, so they are available for
# G1 as soon as the printer is ready.

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

# Declared A axis: auto-registered as G-Code axis "A" at connect time.
# Also exercises the declarative limit/corner velocity config options.
[manual_stepper a_stepper]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 500
position_min: 0
position_max: 100
gcode_axis: A
instantaneous_corner_velocity: 5
limit_velocity: 20
limit_accel: 500

# Declared B axis (endstop-equipped).
[manual_stepper homing_stepper]
step_pin: PB6
dir_pin: !PB7
enable_pin: !PB5
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
position_min: -5
position_max: 50
velocity: 20
accel: 1000
gcode_axis: B

# Declared C axis (no endstop).
[manual_stepper c_stepper]
step_pin: PG0
dir_pin: PG1
enable_pin: !PE2
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 500
position_min: 0
position_max: 100
gcode_axis: C
