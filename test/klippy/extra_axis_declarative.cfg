# F1 fixture: declarative ABC axes via [manual_stepper] gcode_axis:.
#
# Contrast with extra_axis.cfg (F0), which registers A/B dynamically via
# MANUAL_STEPPER ... GCODE_AXIS=. Here the axes are declared in config and
# auto-registered when the toolhead is created, so they are available for
# G1 as soon as the printer is ready.

[mcu]
serial: /dev/ttyACM0

# Guard macro used by extra_axis_declarative.test.  It asserts the global
# axis indices the declared extra axes must own.  Primary axes take 0-2 and
# the extruder takes 3, so every declared axis must land in 4-6, each on a
# distinct index.  An extra axis reported below 4 would mean it had taken
# the slot of a primary axis (the legacy f557a14b bug); a duplicate would
# mean one axis had displaced another.  The exact index of a given axis
# depends on registration order, which is why this checks the index set
# rather than a fixed axis-to-index mapping.
[gcode_macro ASSERT_EXTRA_AXIS_INDICES]
description: Fail unless the declared extra axes own distinct global indices >= 4
gcode:
    {% set names = ['manual_stepper a_stepper',
                    'manual_stepper homing_stepper',
                    'manual_stepper c_stepper'] %}
    {% set indices = [] %}
    {% for name in names %}
        {% set actual = printer.toolhead.extra_axes.get(name) %}
        {% if actual is none %}
            {action_raise_error("%s is missing from toolhead.extra_axes" % name)}
        {% elif actual < 4 %}
            {action_raise_error("%s owns primary axis index %d"
                               % (name, actual))}
        {% elif actual in indices %}
            {action_raise_error("%s reuses axis index %d" % (name, actual))}
        {% else %}
            {% set _ = indices.append(actual) %}
        {% endif %}
    {% endfor %}
    {% if indices | sort != [4, 5, 6] %}
        {action_raise_error("declared extra axes own indices %s, expected 4-6"
                            % (indices | sort))}
    {% endif %}
    {action_respond_info("extra axis indices OK: %s" % (indices | sort))}

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

# Declared A axis: auto-registered as G-Code axis "A" at connect time.
# Also exercises the declarative limit/corner velocity config options.
[manual_stepper a_stepper]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 500
position_min: 0
position_max: 100
gcode_axis: A
instantaneous_corner_velocity: 5
limit_velocity: 20
limit_accel: 500

# Declared B axis (endstop-equipped).
[manual_stepper homing_stepper]
step_pin: PB6
dir_pin: !PB7
enable_pin: !PB5
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB4
position_endstop: 0
position_min: -5
position_max: 50
velocity: 20
accel: 1000
gcode_axis: B

# Declared C axis (no endstop).
[manual_stepper c_stepper]
step_pin: PG0
dir_pin: PG1
enable_pin: !PE2
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 500
position_min: 0
position_max: 100
gcode_axis: C
