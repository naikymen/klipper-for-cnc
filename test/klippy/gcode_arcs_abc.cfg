# F7 fixture: G2/G3 arcs with extra (ABC) axes.
#
# Same cartesian machine as gcode_arcs.cfg (which is kept byte-identical to
# upstream), plus three declaratively registered extra axes:
#
#   A  no endstop, position_max 60 -- a tight bound so that a wrong
#      extra-axis endpoint (e.g. one computed from the absolute target
#      instead of the delta) lands out of range and fails loudly.
#   B  endstop-equipped, so it can be left un-homed to prove that an arc
#      really carries the extra-axis parameter into the move.
#   C  plain, no endstop.

[gcode_arcs]

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[manual_stepper a_stepper]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 500
position_min: 0
position_max: 60
gcode_axis: A

[manual_stepper b_stepper]
step_pin: PG2
dir_pin: !PG3
enable_pin: !PG4
microsteps: 16
rotation_distance: 40
endstop_pin: ^PG5
position_endstop: 0
position_min: -5
position_max: 50
velocity: 20
accel: 1000
gcode_axis: B

[manual_stepper c_stepper]
step_pin: PG6
dir_pin: !PC0
enable_pin: !PC1
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 500
position_min: 0
position_max: 100
gcode_axis: C

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 110

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
